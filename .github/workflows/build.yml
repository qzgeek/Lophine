name: Build Lophine Server

on:
  push:
    branches: [main, ver/26.1.2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply patches and build
        run: |
          chmod +x gradlew
          ./gradlew applyAllPatches --no-daemon
          ./gradlew build -x test --no-daemon

      - name: Find and upload server jar
        run: |
          echo "=== Built jars ==="
          find . -name "*.jar" -path "*/build/libs/*" -not -name "*-sources*" -not -name "*-dev*" | head -20
          echo ""
          echo "=== All jars in lophine-server ==="
          find lophine-server -name "*.jar" 2>/dev/null | head -10
          echo ""
          SERVER_JAR=$(find . -name "lophine-*.jar" -path "*/build/libs/*" | head -1)
          if [ -z "$SERVER_JAR" ]; then
            SERVER_JAR=$(find . -name "*paperclip*.jar" -o -name "*reobf*.jar" | head -1)
          fi
          if [ -z "$SERVER_JAR" ]; then
            SERVER_JAR=$(find lophine-server -name "*.jar" | head -1)
          fi
          echo "Server JAR: $SERVER_JAR"
          cp "$SERVER_JAR" lophine-server.jar 2>/dev/null || echo "No jar found"

      - uses: actions/upload-artifact@v4
        with:
          name: lophine-server
          path: lophine-server.jar
          if-no-files-found: warn
